server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  absolute_redirect off;

  # Senha simples (usuário e senha vêm das variáveis FV_USUARIO e FV_SENHA).
  auth_basic "Vistoria Fundac";
  auth_basic_user_file /etc/nginx/.htpasswd;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

  location = /saude { auth_basic off; return 200 "ok"; }
  location = /fundac-vistoria/saude { auth_basic off; return 200 "ok"; }
  location = /fundac-vistoria { return 301 /fundac-vistoria/; }

  location ~ /sw\.js$ {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/fundac-vistoria/" always;
    try_files /fundac-vistoria/sw.js =404;
  }

  location ~ \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri /fundac-vistoria$uri =404;
  }

  # Funciona com ou sem o prefixo /fundac-vistoria (proxy pode remover o prefixo).
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /fundac-vistoria$uri $uri/index.html /fundac-vistoria$uri/index.html /fundac-vistoria$uri =404;
  }
}
