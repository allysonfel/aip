<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Vistoria de câmeras · AIP</title>
  <link rel="icon" href="img/aip-icone-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    @font-face { font-family: "Barlow"; font-weight: 500; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 600; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: "Barlow", system-ui, sans-serif; font-size: 17px; }
    main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    form { width: min(380px, 100%); }
    .logo { display: block; width: 110px; aspect-ratio: 2238 / 586; background: #fff; -webkit-mask: url("img/aip-logo.png") center / contain no-repeat; mask: url("img/aip-logo.png") center / contain no-repeat; }
    h1 { font-family: "Barlow Condensed", sans-serif; font-size: 34px; line-height: 1.05; margin: 28px 0 6px; }
    p { color: #a3a3a3; margin: 0 0 24px; }
    label { display: block; font-weight: 600; font-size: 15px; margin: 16px 0 8px; }
    input { width: 100%; min-height: 56px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 0.16); background: #0d0d0d; color: #fff; padding: 12px 14px; font: inherit; }
    input:focus, button:focus-visible { outline: 2px solid #5fd3ff; outline-offset: 1px; }
    button { margin-top: 24px; width: 100%; min-height: 58px; border-radius: 10px; border: 0; background: #5fd3ff; color: #000; font-family: "Barlow Condensed", sans-serif; font-size: 22px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .erro { color: #ff8a8a; font-weight: 600; min-height: 1.4em; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <form id="f" autocomplete="on">
      <span class="logo" aria-label="AIP"></span>
      <h1>Vistoria de câmeras</h1>
      <p>Feira da Fundac · Caruaru</p>
      <label for="login">Usuário</label>
      <input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="senha">Senha</label>
      <input id="senha" name="password" type="password" autocomplete="current-password" required>
      <button id="b" type="submit">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = document.getElementById('b'), erro = document.getElementById('erro');
      b.disabled = true; erro.textContent = '';
      try {
        const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: document.getElementById('login').value, senha: document.getElementById('senha').value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.erro || 'Não foi possível entrar.');
        location.replace('./?entrou=' + Date.now());
      } catch (err) {
        erro.textContent = navigator.onLine ? err.message : 'Sem internet. Conecte-se para entrar pela primeira vez.';
        b.disabled = false;
      }
    });
  </script>
</body>
</html>
